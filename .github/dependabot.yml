version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Slidev 52.20+ pulls in UnoCSS 66.10+, which breaks `slidev build`
    # (lightningcss minify: Invalid token in pseudo element). Re-enable once fixed upstream.
    ignore:
      - dependency-name: "@slidev/cli"
      - dependency-name: "unocss"
      - dependency-name: "@unocss/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
